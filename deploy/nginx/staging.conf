server {
    listen 80;
    listen 443 ssl;
    server_name ligara.online www.ligara.online;

    ssl_certificate /etc/letsencrypt/live/ligara.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ligara.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    if ($scheme = http) {
        return 301 https://$host$request_uri;
    }

    client_max_body_size 10m;

    location /static/ {
        alias /srv/static/;
        access_log off;
        expires 1h;
        add_header Cache-Control "public";
    }

    location /media/ {
        alias /srv/media/;
        access_log off;
        expires 1h;
        add_header Cache-Control "public";
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
