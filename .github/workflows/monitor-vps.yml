name: Monitor VPS

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  healthcheck:
    name: Check public health
    runs-on: ubuntu-latest
    steps:
      - name: Check backend health
        run: |
          set -euo pipefail
          check_url() {
            local url="$1"
            local attempt
            for attempt in 1 2 3; do
              if curl --fail --silent --show-error \
                --connect-timeout 10 --max-time 20 \
                --retry 1 --retry-delay 2 --retry-max-time 35 \
                "$url"; then
                return 0
              fi
              if [ "$attempt" -lt 3 ]; then
                sleep 15
              fi
            done
            echo "Healthcheck failed after 3 consecutive probe rounds: $url" >&2
            return 1
          }
          check_url https://ligara.online/health/
      - name: Check frontend
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if curl --fail --silent --show-error --location \
              --connect-timeout 10 --max-time 20 \
              --retry 1 --retry-delay 2 --retry-max-time 35 \
              https://ligara.online/; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep 15
            fi
          done
          echo "Frontend healthcheck failed after 3 consecutive probe rounds." >&2
          exit 1
