name: Monitor VPS

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  healthcheck:
    name: Check public health
    runs-on: ubuntu-latest
    steps:
      - name: Check backend health
        run: curl --fail --silent --show-error --retry 3 --retry-delay 5 https://ligara.online/health/
      - name: Check frontend
        run: curl --fail --silent --show-error --retry 3 --retry-delay 5 --location https://ligara.online/
