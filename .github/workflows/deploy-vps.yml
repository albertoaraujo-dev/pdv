name: Deploy VPS

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:
    inputs:
      deploy_ref:
        description: Commit or tag to deploy
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.name == 'CI' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy over SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY_B64: ${{ secrets.VPS_SSH_KEY_B64 }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
          DEPLOY_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_ref || github.event.workflow_run.head_sha }}
        run: |
          set -eu

          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_SSH_KEY_B64"
          test -n "$VPS_KNOWN_HOSTS"
          test -n "$VPS_APP_DIR"

          install -m 700 -d "$HOME/.ssh"
          install -m 600 /dev/null "$HOME/.ssh/vps_deploy_key"
          printf '%s' "$VPS_SSH_KEY_B64" | base64 --decode > "$HOME/.ssh/vps_deploy_key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"

          ssh -i "$HOME/.ssh/vps_deploy_key" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            "$VPS_USER@$VPS_HOST" \
            "DEPLOY_REF='$DEPLOY_REF' VPS_APP_DIR='$VPS_APP_DIR' sh -s" <<'REMOTE_SCRIPT'
          set -eu

          cd "$VPS_APP_DIR"
          git fetch --prune origin main
          git checkout --force main
          if [ "$DEPLOY_REF" = "main" ]; then
            git reset --hard origin/main
          else
            git reset --hard "$DEPLOY_REF"
          fi

          cd deploy
          sh ../scripts/backup-db.sh
          sh ../scripts/backup-media.sh
          docker compose --env-file .env.staging -f docker-compose.staging.yml build --pull backend migrate frontend
          docker compose --env-file .env.staging -f docker-compose.staging.yml run --rm migrate
          docker compose --env-file .env.staging -f docker-compose.staging.yml up -d backend frontend proxy
          docker compose --env-file .env.staging -f docker-compose.staging.yml up -d --force-recreate --no-deps proxy
          docker compose --env-file .env.staging -f docker-compose.staging.yml ps
          curl --fail --silent --show-error https://ligara.online/health/ >/dev/null
          REMOTE_SCRIPT
